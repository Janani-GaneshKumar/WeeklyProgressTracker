spring.application.name=ContentRecommendation

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# Database Configuration (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/contentrecommendation?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=@Janani31
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT Configuration
# ===============================
# Secret key must be at least 32 characters long
jwt.secret=this-is-a-very-long-secret-key-for-jwt-authentication-123456

# Expiration time in milliseconds (10 hour = 36000000)
jwt.expiration=36000000


# Allow larger file uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.security.user.name=janani
spring.security.user.password=janani31



Spring.output.ansi.enabled=ALWAYS
# Removes thread and logger context from logs
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){blue} %clr(%-5level){yellow} %clr(%logger{36}){green} - %clr(%msg){cyan}%n


spring.web.resources.static-locations=classpath:/static/,file:C:/JAVASPRINGBOOT/contentrecommendation/uploads/



